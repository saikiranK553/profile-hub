<div class="offset-md-4 col-md-4 mt-5">
  <h2 class="mb-4">Login</h2>
  <form *ngIf="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input
        id="email"
        type="text"
        class="form-control"
        formControlName="email"
        [ngClass]="{
          'is-invalid':
            loginForm.get('email')?.touched && loginForm.get('email')?.invalid
        }"
      />
      <div
        *ngIf="
          loginForm.get('email')?.touched && loginForm.get('email')?.errors
        "
        class="invalid-feedback"
      >
        <div *ngIf="loginForm.get('email')?.errors?.['required']">
          Username is required
        </div>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        [ngClass]="{
          'is-invalid':
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
        }"
      />
      <div
        *ngIf="
          loginForm.get('password')?.touched &&
          loginForm.get('password')?.errors
        "
        class="invalid-feedback"
      >
        <div *ngIf="loginForm.get('password')?.errors?.['required']">
          Password is required
        </div>
      </div>
    </div>

    <!-- <div class="text-end mt-1">
      <a
        routerLink="/auth/forgot-password"
        class="text-secondary text-decoration-none"
      >
        Forgot password?
      </a>
    </div> -->

    <button
      class="btn btn-primary w-100"
      type="submit"
      [disabled]="loginForm.invalid"
    >
      Login
    </button>
    <div class="text-center mt-3">
      <small>
        New user?
        <a routerLink="/auth/register">Register here</a>
      </small>
    </div>
  </form>
</div>
